name: Publish npm package

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Update npm
        run: npm install --global npm@latest

      - name: Validate release
        env:
          PACKAGE_NAME: "@osolmaz/pi-workflows"
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $version (expected $expected_tag)." >&2
            exit 1
          fi

          git fetch origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "The release commit is not on origin/$DEFAULT_BRANCH." >&2
            exit 1
          fi

          if npm view "${PACKAGE_NAME}@${version}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${version} is already published." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Publish
        run: npm publish --access public --provenance

      - name: Verify registry
        env:
          PACKAGE_NAME: "@osolmaz/pi-workflows"
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for attempt in {1..12}; do
            published="$(npm view "${PACKAGE_NAME}@${version}" version 2>/dev/null || true)"
            if [[ "$published" == "$version" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Registry did not report ${PACKAGE_NAME}@${version} after publication." >&2
          exit 1
