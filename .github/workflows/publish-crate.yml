name: Publish crates.io package

on:
  release:
    types: [published]

concurrency:
  group: publish-crate-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: npm ci

      - name: Prepare release artifacts
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          node scripts/release-verify.mjs prepare \
            --expected-main-commit "origin/${DEFAULT_BRANCH}" \
            --out-dir release-artifacts

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          set -euo pipefail
          state="$(node scripts/release-verify.mjs registry-state --manifest release-artifacts/release-manifest.json --kind crate)"
          if [[ "$state" == "matched" ]]; then
            echo "crates.io 0.14.4 already matches the release manifest"
            exit 0
          fi
          if [[ "$state" != "absent" && "$state" != "unchecked" ]]; then
            echo "crates.io registry state is $state" >&2
            exit 1
          fi
          cargo publish --manifest-path tui/Cargo.toml

      - name: Verify registry
        run: node scripts/release-verify.mjs verify-registry --manifest release-artifacts/release-manifest.json --kind crate
